<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1464"/>
      <stop offset="0.55" stop-color="#4a2bb8"/>
      <stop offset="1" stop-color="#8b4dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#9fe7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6a5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df3ff"/>
      <stop offset="1" stop-color="#d28bff"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe9ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)" opacity="0.55"/>

  <!-- orbit rings -->
  <ellipse cx="256" cy="256" rx="156" ry="58" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" opacity="0.9" transform="rotate(-28 256 256)"/>
  <ellipse cx="256" cy="256" rx="156" ry="58" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.45" transform="rotate(32 256 256)"/>

  <!-- central spark -->
  <path d="M256 128 C264 206 306 248 384 256 C306 264 264 306 256 384 C248 306 206 264 128 256 C206 248 248 206 256 128 Z" fill="url(#star)"/>
  <circle cx="256" cy="256" r="26" fill="#ffffff"/>

  <!-- orbiting nodes -->
  <circle cx="386" cy="198" r="13" fill="#7df3ff"/>
  <circle cx="126" cy="314" r="10" fill="#d28bff"/>
  <circle cx="352" cy="372" r="6" fill="#ffffff" opacity="0.85"/>
  <circle cx="160" cy="150" r="5" fill="#ffffff" opacity="0.7"/>
</svg>
